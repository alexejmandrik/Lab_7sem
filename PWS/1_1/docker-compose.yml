
services:
  ws01-01-1:
    environment:
      SERVER_NAME: server1
    build:
      context: ./WS01-01
      dockerfile: Dockerfile
    container_name: ws01-01-1
    expose:
      - "8080"

  ws01-01-2:
    environment:
      SERVER_NAME: server2
    build:
      context: ./WS01-01
      dockerfile: Dockerfile
    container_name: ws01-01-2
    expose:
      - "8080"

  gateway:
    build:
      context: ./Gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "5000:8080"
    depends_on:
      - ws01-01-1
      - ws01-01-2
