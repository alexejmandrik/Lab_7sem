<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REST-сервис MAI — WS01-01</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 0 15px;
        }

        h1 { text-align: center; }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            margin: 10px 3px 0 0;
            cursor: pointer;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.6;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eee;
            border-radius: 5px;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        #status {
            margin-top: 10px;
            color: #555;
        }
    </style>
</head>

<body>
    <h1>REST-сервис MAI</h1>
    <p>WS01-01 — Sticky Session</p>

    <label for="resultValue">RESULT:</label>
    <input type="number" id="resultValue" value="0" step="1">

    <label for="addValue">ADD:</label>
    <input type="number" id="addValue" value="1" step="1">

    <div>
        <button onclick="getResult()">GET</button>
        <button onclick="setResult()">POST</button>
        <button onclick="pushValue()">PUT</button>
        <button onclick="popValue()">DELETE</button>
    </div>

    <div id="status">Готов к работе</div>
    <div id="result">Результат появится здесь</div>

    <script>
        // Адрес Gateway для заданий 1–2.
        const url = "http://localhost:5000/stack";

        let requestInProgress = false;

        async function sendRequest(method, requestUrl = url, body = null) {
            if (requestInProgress) return;

            requestInProgress = true;

            const buttons = document.querySelectorAll("button");
            buttons.forEach(button => button.disabled = true);

            try {
                const options = {
                    method: method,
                    credentials: "include"
                };

                if (body !== null) {
                    options.headers = {
                        "Content-Type": "application/json"
                    };
                    options.body = JSON.stringify(body);
                }

                document.getElementById("status").textContent =
                    "Выполняется " + method + "...";

                const response = await fetch(requestUrl, options);
                const text = await response.text();

                let data;
                try {
                    data = JSON.parse(text);
                } catch {
                    data = text;
                }

                document.getElementById("status").textContent =
                    method + " — HTTP " + response.status;

                document.getElementById("result").textContent =
                    typeof data === "string"
                        ? data
                        : JSON.stringify(data, null, 2);

                if (data && typeof data === "object" &&
                    data.RESULT !== undefined) {
                    document.getElementById("resultValue").value =
                        data.RESULT;
                }

            } catch (error) {
                document.getElementById("status").textContent =
                    "Ошибка запроса";

                document.getElementById("result").textContent =
                    "Не удалось выполнить запрос: " + error.message +
                    "\nПроверь адрес Gateway, CORS и cookie GatewayAffinity.";
            } finally {
                requestInProgress = false;
                buttons.forEach(button => button.disabled = false);
            }
        }

        function getResult() {
            return sendRequest("GET");
        }

        function setResult() {
            const value = document.getElementById("resultValue").value;

            if (value.trim() === "" || !Number.isInteger(Number(value))) {
                alert("RESULT должен быть целым числом");
                return;
            }

            return sendRequest("POST", url, {
                RESULT: Number(value)
            });
        }

        function pushValue() {
            const value = document.getElementById("addValue").value;

            if (value.trim() === "" || !Number.isInteger(Number(value))) {
                alert("ADD должен быть целым числом");
                return;
            }

            return sendRequest(
                "PUT",
                url + "?ADD=" + encodeURIComponent(value)
            );
        }

        function popValue() {
            return sendRequest("DELETE");
        }
    </script>
</body>
</html>
